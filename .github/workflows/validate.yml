name: Validate

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Check required files
        run: |
          test -f README.md
          test -f docs/vps-operations.md
          test -f docs/runbook.md
          test -f docs/vps-workspace-operations.md
          test -f docs/vps-phase2-workspace-setup.md
          test -f docs/vps-ai-operator.md
          test -f docs/vps-job-inbox.md
          test -f docs/vps-github-bridge.md
          test -f docs/mobile-vps-jobs.md
          test -f scripts/setup_workspaces.sh
          test -f scripts/register_workspace.sh
          test -f scripts/workspace_status.sh
          test -f scripts/run_repo_check.sh
          test -f scripts/report_workspaces.sh
          test -f scripts/setup_operator_user.sh
          test -f scripts/create_job.sh
          test -f scripts/run_job_once.sh
          test -f scripts/job_status.sh
          test -f scripts/report_job_result.sh
          test -f scripts/import_github_jobs.sh
          test -f scripts/post_job_result_to_github.sh
          test -f systemd/ai-council-job-runner.service
          test -f systemd/ai-council-job-runner.timer
          test -f systemd/ai-council-github-bridge.service
          test -f systemd/ai-council-github-bridge.timer
          test -f .github/ISSUE_TEMPLATE/vps-job.md
          test -f .github/ISSUE_TEMPLATE/vps-job-mobile.yml
