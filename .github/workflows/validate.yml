name: Validate

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Check required Markdown files
        run: |
          test -f README.md
          test -f docs/vps-operations.md
          test -f docs/runbook.md
