name: VPS AI Plan
description: Ask the VPS to create a safe AI worker plan
title: "[VPS AI Plan] ai-councilの作業計画を立てて"
labels:
  - vps-job
body:
  - type: markdown
    attributes:
      value: |
        VPSに計画レポートだけを作らせるフォームです。

        このjobはコード編集、push、PR作成をしません。

  - type: textarea
    id: command
    attributes:
      label: VPS job command
      description: 普通はこのまま投稿してください。
      value: |
        JOB_TYPE=ai_plan
        REPO_NAME=ai-council
      render: text
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: やってほしいこと
      description: 例: PC負荷を下げるため、次にVPSへ移す作業を整理して。
      placeholder: ai-councilの次の作業計画を立てて
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: パスワード、token、SSH秘密鍵、APIキー、その他secretsを書いていません。
          required: true
        - label: コード編集、git push、PR作成はこのjobでは依頼していません。
          required: true
